[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ops-agent"
version = "0.1.0.dev3"
description = "Linux execution agent for AI Ops protocol 1.1/1.2"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
ai-ops-agent = "ai_ops_agent.agent:main"
ai-ops-agent-install = "ai_ops_agent.service:main"

[tool.setuptools.packages.find]
include = ["ai_ops_agent*"]

[tool.setuptools.package-data]
ai_ops_agent = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
